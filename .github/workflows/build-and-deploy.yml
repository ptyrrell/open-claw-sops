name: Build SOPs and deploy to Pages

on:
  push:
    branches: [main]
    paths:
      - 'sops/**'
      - 'templates/**'
      - 'scripts/**'
      - 'docs/styles.css'
      - 'docs/favicon.svg'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - run: npm run build
      - name: Commit regenerated docs/ if changed
        run: |
          git config user.name  "open-claw-sops-bot"
          git config user.email "bot@paultyrrell.dev"
          git add docs/
          if git diff --cached --quiet; then
            echo "No docs/ changes to commit."
          else
            git commit -m "build: regenerate docs/ [skip ci]"
            git push
          fi
